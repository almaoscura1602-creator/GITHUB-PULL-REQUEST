<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-900 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NovaSaaS - Iniciar Sesión</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="h-full flex flex-col justify-center items-center px-6 py-12 antialiased selection:bg-sky-500 selection:text-slate-950">

    <div class="w-full max-w-md">
        <a href="landing.html" class="inline-flex items-center space-x-2 text-sm text-slate-400 hover:text-white mb-6 transition">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            <span>Volver al Inicio (Landing)</span>
        </a>

        <div class="glass-panel p-8 sm:p-10 rounded-3xl shadow-2xl relative overflow-hidden">
            <div class="absolute -top-24 -right-24 w-48 h-48 bg-sky-500/10 rounded-full blur-3xl pointer-events-none"></div>

            <div class="text-center mb-8">
                <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center shadow-lg shadow-sky-500/20 mx-auto mb-4">
                    <i data-lucide="lock" class="w-6 h-6 text-white"></i>
                </div>
                <h2 class="text-2xl font-extrabold text-white tracking-tight">Iniciar Sesión</h2>
                <p class="text-xs text-slate-400 mt-1">Ingresa para acceder al sistema <span class="text-sky-400 font-semibold">app.html</span></p>
            </div>

            <form onsubmit="handleLoginSubmit(event)" class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">Correo Electrónico</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                            <i data-lucide="mail" class="w-4 h-4"></i>
                        </span>
                        <input type="email" id="email" value="admin@novasaas.com" required
                            class="w-full pl-10 pr-4 py-3 rounded-xl bg-slate-900/80 border border-slate-700 focus:border-sky-500 focus:ring-1 focus:ring-sky-500 text-sm text-white placeholder-slate-500 outline-none transition">
                    </div>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-2">
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300">Contraseña</label>
                    </div>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                            <i data-lucide="key" class="w-4 h-4"></i>
                        </span>
                        <input type="password" id="password" value="password123" required
                            class="w-full pl-10 pr-4 py-3 rounded-xl bg-slate-900/80 border border-slate-700 focus:border-sky-500 focus:ring-1 focus:ring-sky-500 text-sm text-white placeholder-slate-500 outline-none transition">
                    </div>
                </div>

                <button type="submit" class="w-full py-3.5 rounded-xl bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold text-sm transition shadow-lg shadow-sky-500/25 flex items-center justify-center space-x-2">
                    <span>Acceder a la App Dashboard</span>
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </form>
        </div>
    </div>

    <script>
        lucide.createIcons();

        function handleLoginSubmit(event) {
            event.preventDefault();
            const btn = event.target.querySelector('button[type="submit"]');
            btn.innerHTML = `<span>Autenticando...</span>`;
            
            setTimeout(() => {
                // Redirection to app.html as requested
                window.location.href = 'app.html';
            }, 600);
        }
    </script>
</body>
</html>
